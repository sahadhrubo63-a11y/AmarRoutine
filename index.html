<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Routine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div id="onboarding-screen" class="container">
        <div class="welcome-box">
            <h2>🎯 Welcome to Amar Routine</h2>
            <p>Create a dashboard by selecting your institution and course name.</p>
            
            <div class="input-group">
                <label for="inst-name">University / School / College Name:</label>
                <input type="text" id="inst-name" placeholder="e.g. NUBT Khulna">
            </div>

            <div class="input-group">
                <label for="dept-program">Select Your Course / Department:</label>
                <select id="dept-program">
                    <optgroup label="🔬 Science Background">
                        <option value="CSE">CSE (Computer Science & Engineering)</option>
                        <option value="SWE">SWE (Software Engineering)</option>
                        <option value="EEE">EEE (Electrical & Electronic Engineering)</option>
                        <option value="Civil">Civil Engineering</option>
                        <option value="Mechanical">Mechanical Engineering</option>
                    </optgroup>
                </select>
            </div>
            <button class="btn-primary" onclick="initializeApp()">Next Step ➡️</button>
        </div>
    </div>

    <div id="dashboard-screen" class="container hidden">
        <div class="smart-widget">
            <div class="clock-section">
                <div id="digital-clock">00:00:00 AM</div>
                <div id="live-date">Loading Date, Day...</div>
            </div>
            <div class="weather-section" id="weather-box">
                <p>🌤️ Weather Tracking...</p>
            </div>
        </div>

        <div class="dashboard-header">
            <div>
                <h1 id="display-inst-name">UNIVERSITY NAME</h1>
                <p id="display-program" class="program-sub">Department/Program Name</p>
            </div>
            <button class="btn-reset" onclick="resetApp()">Reset All</button>
        </div>

        <div class="action-bar">
            <button class="btn-action" onclick="openModal('manual-modal')">➕ Class</button>
            <button class="btn-action btn-exam" onclick="openModal('exam-modal')">📝 Exam</button>
            <button class="btn-download" onclick="downloadRoutineImage()">🖼️ Download Image</button>
        </div>

        <div id="routine-capture-area" class="routine-theme-board">
            <div id="routine-container"></div>
            <div id="exam-container"></div>
        </div>
    </div>

    <div id="manual-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('manual-modal')">&times;</span>
            <h2>➕ Add New Class</h2>
            <form id="manual-form">
                <input type="text" id="m-subject" placeholder="Subject Name" required>
                <input type="text" id="m-code" placeholder="Course Code" required>
                <input type="text" id="m-teacher" placeholder="Teacher Code">
                <input type="text" id="m-room" placeholder="Room/Lab No">
                <input type="time" id="m-time" required>
                <select id="m-day">
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Save Class</button>
            </form>
        </div>
    </div>

    <div id="exam-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('exam-modal')">&times;</span>
            <h2>📝 Add Exam Schedule</h2>
            <form id="exam-form">
                <input type="text" id="e-subject" placeholder="Subject/Course Name" required>
                <input type="text" id="e-code" placeholder="Course Code" required>
                <label>Set Time:</label>
                <input type="time" id="e-time" required>
                <label>Set Date:</label>
                <input type="date" id="e-date" required>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Save Exam</button>
            </form>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/911/911-84.wav" preload="auto"></audio>
    <script src="capacitor.js"></script>
    <script src="app.js"></script>
</body>
</html>
