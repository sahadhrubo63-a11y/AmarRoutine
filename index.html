<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Routine - Professional Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div id="onboarding-screen" class="container">
        <div class="welcome-box">
            <div class="brand-badge">🎯 Academic Workspace</div>
            <h2>Welcome to Amar Routine</h2>
            <p>Create a personalized dashboard tailored to your academic curriculum.</p>
            
            <div class="input-group">
                <label for="inst-name">Institution Name (University / College / School)</label>
                <input type="text" id="inst-name" placeholder="e.g., NUBT Khulna CAPITAL" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="dept-program">Select Your Department / Course / Group</label>
                <select id="dept-program">
                    <optgroup label="🔬 University - Science & Engineering (Emerald)">
                        <option value="CSE">CSE (Computer Science & Engineering)</option>
                        <option value="SWE">SWE (Software Engineering)</option>
                        <option value="EEE">EEE (Electrical & Electronic Engineering)</option>
                        <option value="Civil">Civil Engineering</option>
                        <option value="Mechanical">Mechanical Engineering</option>
                        <option value="Textile">Textile Engineering</option>
                        <option value="BSc Physics">BSc in Physics</option>
                        <option value="BSc Chemistry">BSc in Chemistry</option>
                        <option value="BSc Math">BSc in Mathematics</option>
                    </optgroup>
                    
                    <optgroup label="💼 University - Business & Commerce (Amber)">
                        <option value="BBA">BBA (Bachelor of Business Administration)</option>
                        <option value="MBA">MBA (Master of Business Administration)</option>
                        <option value="Accounting">Accounting & Information Systems</option>
                        <option value="Finance">Finance & Banking</option>
                        <option value="Management">Management Studies</option>
                        <option value="Marketing">Marketing</option>
                    </optgroup>

                    <optgroup label="🎨 University - Arts & Social Sciences (Sky Blue)">
                        <option value="English">BA in English</option>
                        <option value="Bangla">BA in Bangla</option>
                        <option value="LLB">LL.B (Bachelor of Laws)</option>
                        <option value="Economics">BSS in Economics</option>
                        <option value="Sociology">BSS in Sociology</option>
                        <option value="Political Science">BSS in Political Science</option>
                        <option value="Journalism">Media & Journalism</option>
                    </optgroup>

                    <optgroup label="🏫 College / Higher Secondary (11-12)">
                        <option value="College Science">College - Science Group</option>
                        <option value="College Commerce">College - Business Studies (Commerce)</option>
                        <option value="College Arts">College - Humanities (Arts)</option>
                    </optgroup>

                    <optgroup label="🎒 School / Secondary (9-10)">
                        <option value="School Science">School - Science Group</option>
                        <option value="School Commerce">School - Business Studies (Commerce)</option>
                        <option value="School Arts">School - Humanities (Arts)</option>
                    </optgroup>
                </select>
            </div>
            <button class="btn-primary" onclick="initializeApp()">Generate Workspace ➡️</button>
        </div>
    </div>

    <div id="dashboard-screen" class="container hidden">
        
        <div class="smart-widget">
            <div class="clock-section">
                <div id="digital-clock">00:00:00 AM</div>
                <div id="live-date">Loading active session...</div>
            </div>
            <div class="weather-section" id="weather-box">
                <div class="weather-skeleton">📍 Synchronizing location...</div>
            </div>
        </div>

        <div class="dashboard-header">
            <div>
                <h1 id="display-inst-name">ACADEMIC INSTITUTION</h1>
                <div class="program-badge">
                    <span class="pulse-indicator"></span>
                    <span id="display-program">Department Portal</span>
                </div>
            </div>
            <button class="btn-reset" onclick="resetApp()">Reset Workspace</button>
        </div>

        <div class="action-bar">
            <div class="action-left">
                <button class="btn-action btn-add-class" onclick="openModal('manual-modal')">➕ Add Class</button>
                <button class="btn-action btn-add-exam" onclick="openModal('exam-modal')">📝 Add Exam</button>
            </div>
            <button class="btn-download" onclick="downloadRoutineImage()">🖼️ Export Canvas</button>
        </div>

        <div id="routine-capture-area" class="routine-theme-board">
            <div id="routine-container"></div>
            <div id="exam-container"></div>
        </div>
    </div>

    <div id="manual-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Schedule New Class</h2>
                <span class="close-btn" onclick="closeModal('manual-modal')">&times;</span>
            </div>
            <form id="manual-form" class="pro-form">
                <div class="form-grid">
                    <input type="text" id="m-subject" placeholder="Subject / Course Title" required>
                    <input type="text" id="m-code" placeholder="Course Code / Subject ID" required>
                    <input type="text" id="m-teacher" placeholder="Teacher Name / Code">
                    <input type="text" id="m-room" placeholder="Room / Lab / Building">
                </div>
                <div class="form-row">
                    <div class="input-field">
                        <label>Start Time</label>
                        <input type="time" id="m-time" required>
                    </div>
                    <div class="input-field">
                        <label>Week Day</label>
                        <select id="m-day">
                            <option value="Saturday">Saturday</option>
                            <option value="Sunday">Sunday</option>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Commit to Schedule</button>
            </form>
        </div>
    </div>

    <div id="exam-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📝 Create Exam Timeline</h2>
                <span class="close-btn" onclick="closeModal('exam-modal')">&times;</span>
            </div>
            <form id="exam-form" class="pro-form">
                <div class="form-grid">
                    <input type="text" id="e-subject" placeholder="Exam Subject Title" required>
                    <input type="text" id="e-code" placeholder="Course Code" required>
                </div>
                <div class="form-row">
                    <div class="input-field">
                        <label>Exam Start Time</label>
                        <input type="time" id="e-time" required>
                    </div>
                    <div class="input-field">
                        <label>Calendar Date</label>
                        <input type="date" id="e-date" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit btn-submit-exam">Publish Timeline</button>
            </form>
        </div>
    </div>

    <script src="capacitor.js"></script>
    <script src="app.js"></script>
</body>
</html>
