<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amar Routine - Dynamic University Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="onboarding-screen" class="container">
        <div class="welcome-box">
            <h2>🎯 Welcome to Amar Routine</h2>
            <p>আপনার প্রতিষ্ঠান এবং কোর্সের নাম সিলেক্ট করে ড্যাশবোর্ড তৈরি করুন।</p>
            
            <div class="input-group">
                <label for="inst-name">University / School / College Name:</label>
                <input type="text" id="inst-name" placeholder="e.g. Northern University of Business and Technology Khulna">
            </div>

            <div class="input-group">
                <label for="dept-program">Select Your Course / Department:</label>
                <select id="dept-program">
                    <optgroup label="🔬 Science Background">
                        <option value="CSE">CSE (Computer Science & Engineering)</option>
                        <option value="SWE">SWE (Software Engineering)</option>
                        <option value="EEE">EEE (Electrical & Electronic Engineering)</option>
                        <option value="Civil">Civil Engineering</option>
                        <option value="Mechanical">Mechanical Engineering</option>
                        <option value="Textile">Textile Engineering</option>
                        <option value="Pharmacy">Bachelor of Pharmacy</option>
                        <option value="BSc-Physics">B.Sc. in Physics</option>
                        <option value="BSc-Math">B.Sc. in Mathematics</option>
                    </optgroup>
                    
                    <optgroup label="💼 Commerce Background">
                        <option value="BBA">BBA (Bachelor of Business Administration)</option>
                        <option value="Accounting">Accounting & Information Systems</option>
                        <option value="Finance">Finance & Banking</option>
                        <option value="Management">Management Studies</option>
                        <option value="Marketing">Marketing</option>
                        <option value="HRM">Human Resource Management</option>
                    </optgroup>
                    
                    <optgroup label="🎨 Arts / Humanities Background">
                        <option value="English">BA in English</option>
                        <option value="LLB">LLB (Bachelor of Laws)</option>
                        <option value="Economics">BSS in Economics</option>
                        <option value="Sociology">Sociology</option>
                        <option value="Bangla">BA in Bangla</option>
                        <option value="Journalism">Journalism & Media Studies</option>
                        <option value="History">BA in History</option>
                    </optgroup>
                </select>
            </div>

            <button class="btn-primary" onclick="initializeApp()">Create Dashboard 🚀</button>
        </div>
    </div>

    <div id="dashboard-screen" class="container hidden">
        <header class="dashboard-header">
            <div>
                <h1 id="display-inst-name">UNIVERSITY NAME</h1>
                <p id="display-program-name">Program: CSE</p>
            </div>
            <button class="btn-reset" onclick="resetApp()">🔄 Change Info</button>
        </header>

        <div class="action-bar">
            <button class="btn-action" onclick="openModal('manual-modal')">➕ Add Class Manually</button>
        </div>

        <main class="routine-section">
            <h2>📅 Your Class Schedule</h2>
            <div id="routine-list">
                </div>
        </main>
    </div>

    <div id="manual-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('manual-modal')">&times;</span>
            <h2>➕ Add New Class</h2>
            <form id="manual-form">
                <input type="text" id="m-subject" placeholder="Subject Name" required>
                <input type="text" id="m-code" placeholder="Course Code (e.g. CSE 2101)" required>
                <input type="text" id="m-teacher" placeholder="Teacher Code (e.g. TAJ)">
                <input type="text" id="m-room" placeholder="Room/Lab No (e.g. 201)">
                <input type="time" id="m-time" required>
                <select id="m-day">
                    <option value="Saturday">Saturday</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
                <button type="submit" class="btn-primary" style="margin-top: 15px;">Save Class</button>
            </form>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-120.wav" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
