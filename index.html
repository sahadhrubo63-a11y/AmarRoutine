<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmarRoutine - Your Digital Classroom Assistant</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="default-theme">

    <div id="onboarding-screen" class="screen">
        <div class="welcome-box">
            <h1>AmarRoutine <span class="app-logo">⏰</span></h1>
            <p>Please enter your institution and program details to start</p>
            
            <div class="input-group">
                <label>University / School Name:</label>
                <input type="text" id="inst-name" placeholder="e.g., BUET, DU, or Model School" required>
            </div>
            
            <div class="input-group">
                <label>Program / Department / Group:</label>
                <select id="dept-program" required>
                    <option value="">-- Select Option --</option>
                    <option value="CSE">CSE (Computer Science)</option>
                    <option value="EEE">EEE (Electrical Engineering)</option>
                    <option value="Science">Science Group</option>
                    <option value="Commerce">Commerce Group</option>
                    <option value="Arts">Arts / Humanities</option>
                </select>
            </div>
            
            <button id="start-btn" onclick="initializeApp()">Enter Dashboard</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
        
        <header id="top-banner" class="cover-banner">
            <div class="banner-overlay">
                <h1 id="display-inst-name">Institution Name</h1>
                <p id="display-program-name">Program: General</p>
                <button onclick="resetApp()" class="reset-btn">🔄 Change Info</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="control-panel">
                <button onclick="openModal('manual-modal')" class="btn-primary">➕ Add Routine Manually</button>
                <button onclick="openModal('upload-modal')" class="btn-secondary">📸 Auto-Routine from Image</button>
            </div>

            <section class="routine-section">
                <h2>📅 Today's Schedule (Chronological Order)</h2>
                <div id="routine-list" class="routine-grid">
                    <p class="no-routine">No schedule set. Use the buttons above to add classes.</p>
                </div>
            </section>
        </main>
    </div>

    <div id="manual-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Add New Class</h3>
            <form id="manual-form" onsubmit="saveManualRoutine(event)">
                <div class="input-group">
                    <input type="text" id="m-subject" placeholder="Subject Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="m-code" placeholder="Course Code" required>
                </div>
                <div class="input-group">
                    <input type="text" id="m-teacher" placeholder="Teacher Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="m-room" placeholder="Room No" required>
                </div>
                <div class="input-group">
                    <label>Class Time:</label>
                    <input type="time" id="m-time" required>
                </div>
                <div class="input-group">
                    <label>Day of the Week:</label>
                    <select id="m-day" required>
                        <option value="Saturday">Saturday</option>
                        <option value="Sunday">Sunday</option>
                        <option value="Monday">Monday</option>
                        <option value="Tuesday">Tuesday</option>
                        <option value="Wednesday">Wednesday</option>
                        <option value="Thursday">Thursday</option>
                        <option value="Friday">Friday</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Save Class</button>
                    <button type="button" onclick="closeModal('manual-modal')" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="upload-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Smart Routine Scanner (AI)</h3>
            <div class="input-group">
                <label>Your Specific Section Name (e.g., A, B, Sec-2):</label>
                <input type="text" id="filter-section" placeholder="Enter exact section code">
            </div>
            <div class="input-group">
                <label>Upload Routine Image:</label>
                <input type="file" id="routine-file" accept="image/*">
            </div>
            <div id="scan-status" class="status-text"></div>
            <div class="modal-buttons">
                <button onclick="processRoutineFile()" class="btn-save">Process & Extract</button>
                <button type="button" onclick="closeModal('upload-modal')" class="btn-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-default.wav" loop></audio>

    <script src="app.js"></script>
</body>
</html>
